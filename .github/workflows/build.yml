name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check
        run: git ls-files '*.h' '*.cpp' '*.c' | xargs pipx run clang-format==23.1.3 --dry-run -Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            extension: tar.gz
            shell: micromamba-shell {0}
            configure: ""
          - os: windows-2025
            name: windows-x86_64
            extension: zip
            shell: msys2 {0}
            configure: ""
          - os: macos-15
            name: macos-arm64
            extension: tar.gz
            shell: bash
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=g++-16
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: runner.os == 'Linux'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: gcc=16.2 gxx=16.2 sysroot_linux-64=2.39 cmake ninja perl make
          condarc: |
            channels:
              - conda-forge

      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make perl zip
          pacboy: gcc:p cmake:p ninja:p

      - if: runner.os == 'macOS'
        run: brew install gcc cmake ninja

      - name: configure
        run: cmake --preset release ${{ matrix.configure }}

      - name: build
        run: cmake --build --preset release

      - name: test
        run: ctest --preset release

      - name: package
        run: |
          package="tapin-cli-${PACKAGE_VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${package}"
          if [ "$RUNNER_OS" = "Windows" ]; then binary=tapin-cli.exe; else binary=tapin-cli; fi
          cp "build/release/${binary}" "dist/${package}/"
          strip "dist/${package}/${binary}"
          cp LICENSE THIRD_PARTY_LICENSES.txt README.md "dist/${package}/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then zip -r "${package}.zip" "${package}"; else tar -czf "${package}.tar.gz" "${package}"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/tapin-cli-${{ env.PACKAGE_VERSION }}-${{ matrix.name }}.${{ matrix.extension }}
          archive: false
          if-no-files-found: error

  sanitize:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: gcc=16.2 gxx=16.2 sysroot_linux-64=2.39 cmake ninja perl make
          condarc: |
            channels:
              - conda-forge

      - name: configure
        run: cmake --preset debug

      - name: build
        run: cmake --build --preset debug

      - name: test
        run: ctest --preset debug

  # The built binary on systems that have no toolchain. Run through docker: the actions need a newer libc than the
  # oldest of these has, so a job container can't work.
  smoke-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:18.04
            prepare: apt-get -qq update && apt-get -qq install -y ca-certificates
          - image: ubuntu:26.04
            prepare: apt-get -qq update && apt-get -qq install -y ca-certificates
          - image: debian:12
            prepare: apt-get -qq update && apt-get -qq install -y ca-certificates
          - image: fedora:latest
            prepare: "true"
          - image: archlinux:latest
            prepare: "true"
          - image: alpine:latest
            prepare: apk add -q ca-certificates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tapin-cli-${{ env.PACKAGE_VERSION }}-linux-x86_64.tar.gz

      - name: unpack
        run: tar -xzf tapin-cli-*.tar.gz --strip-components=1

      - name: run
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }}
          sh -c '${{ matrix.prepare }} && sh scripts/smoke_test.sh /work/tapin-cli'

  smoke-windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tapin-cli-${{ env.PACKAGE_VERSION }}-windows-x86_64.zip
          skip-decompress: true

      - name: unpack
        run: 7z x tapin-cli-*.zip -ounpacked

      - name: run
        run: sh scripts/smoke_test.sh "$(echo "$PWD"/unpacked/*/tapin-cli.exe)"

  smoke-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tapin-cli-${{ env.PACKAGE_VERSION }}-macos-arm64.tar.gz

      - name: unpack
        run: tar -xzf tapin-cli-*.tar.gz --strip-components=1

      - name: run
        run: sh scripts/smoke_test.sh "$PWD/tapin-cli"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build, sanitize, smoke-linux, smoke-windows, smoke-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check the tag matches the project version
        run: grep -q "project(tapin_cli VERSION ${GITHUB_REF_NAME#v} " CMakeLists.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
